<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drag & Drop Bookmark Grid</title>
    <!-- Load SortableJS from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: transparent;
            color: #f8fafc;
            overflow: hidden; /* Scroll is handled by the parent page */
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 5px;
        }

        /* Responsive grid mapping for mobile and tablets */
        @media (max-width: 1200px) {
            .grid-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 480px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }

        .bookmark-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            text-align: center;
            position: relative;
            box-sizing: border-box;
        }

        .bookmark-card:hover {
            transform: translateY(-4px);
            border-color: #10b981; /* Emerald green highlight */
            box-shadow: 0 20px 25px -5px rgba(16, 185, 129, 0.1);
        }

        .bookmark-title {
            font-size: 1.25rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 12px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bookmark-link {
            color: #f8fafc;
            text-decoration: none;
            transition: color 0.2s;
            display: block;
            width: 100%;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .bookmark-link:hover {
            color: #10b981;
        }

        .bookmark-toolbar {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-top: 15px;
        }

        .toolbar-btn {
            background-color: #334155;
            color: #e2e8f0;
            border: 1px solid #475569;
            border-radius: 6px;
            padding: 8px;
            text-align: center;
            text-decoration: none;
            flex: 1;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-sizing: border-box;
        }

        .toolbar-btn:hover {
            background-color: #475569;
            color: #ffffff;
            border-color: #64748b;
        }

        /* Dragging ghost element effect */
        .sortable-ghost {
            opacity: 0.3;
            border: 2px dashed #10b981;
            background-color: #0f172a !important;
            transform: scale(0.95);
        }

        /* Delete Confirmation Card */
        .delete-confirm-card {
            border-color: #b91c1c !important;
            background: linear-gradient(135deg, #7f1d1d, #450a0a) !important;
        }

        .confirm-message {
            font-weight: bold;
            color: #fca5a5;
            margin-bottom: 15px;
            font-size: 1.1rem;
            text-align: center;
        }

        .confirm-actions {
            display: flex;
            gap: 10px;
        }

        .confirm-btn {
            flex: 1;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            border: none;
            font-weight: bold;
            transition: all 0.2s;
            cursor: pointer;
            box-sizing: border-box;
        }

        .yes-btn {
            background-color: #b91c1c;
            color: white;
            border: 1px solid #ef4444;
        }

        .yes-btn:hover {
            background-color: #dc2626;
        }

        .no-btn {
            background-color: #475569;
            color: #e2e8f0;
            border: 1px solid #64748b;
        }

        .no-btn:hover {
            background-color: #64748b;
            color: white;
        }
    </style>
</head>
<body>
    <div id="grid" class="grid-container">
        <!-- Rendered dynamically -->
    </div>

    <script>
        // 1. Raw Message communication helper for Streamlit
        function sendMessageToStreamlitClient(type, data) {
            const message = {
                ...data,
                isStreamlitMessage: true,
                type: type,
            };
            window.parent.postMessage(message, "*");
        }

        // Action trigger helper
        function onAction(actionName, itemId) {
            sendMessageToStreamlitClient("streamlit:setComponentValue", {
                value: { action: actionName, id: itemId }
            });
        }

        // Set frame height helper
        function sendHeight() {
            sendMessageToStreamlitClient("streamlit:setFrameHeight", {
                height: document.body.scrollHeight
            });
        }

        // 2. Render function
        function renderGrid(bookmarks, deleteId) {
            const grid = document.getElementById("grid");
            grid.innerHTML = ""; // Clear existing grid

            if (!bookmarks || bookmarks.length === 0) {
                grid.innerHTML = '<div style="color: #64748b; text-align: center; grid-column: span 4; padding: 40px; font-size: 1.1rem;">등록된 북마크가 없습니다.</div>';
                sendHeight();
                return;
            }

            bookmarks.forEach((item) => {
                const card = document.createElement("div");
                card.className = "bookmark-card";
                card.setAttribute("data-id", item.id);

                if (deleteId === item.id) {
                    card.className += " delete-confirm-card";
                    card.innerHTML = `
                        <div class="confirm-message">정말 삭제할까요?</div>
                        <div class="confirm-actions">
                            <button class="confirm-btn yes-btn" onclick="onAction('confirm_delete', '${item.id}')">예</button>
                            <button class="confirm-btn no-btn" onclick="onAction('cancel_delete', '${item.id}')">아니오</button>
                        </div>
                    `;
                } else {
                    card.innerHTML = `
                        <div class="bookmark-title">
                            <a class="bookmark-link" href="${item.url}" target="_blank" title="${item.name}">${item.name}</a>
                        </div>
                        <div class="bookmark-toolbar">
                            <div class="drag-handle toolbar-btn" style="cursor: move;" title="드래그하여 순서 변경">☰</div>
                            <button class="toolbar-btn" onclick="onAction('edit', '${item.id}')" title="수정">✏️</button>
                            <button class="toolbar-btn" onclick="onAction('delete', '${item.id}')" title="삭제">🗑️</button>
                        </div>
                    `;
                }
                grid.appendChild(card);
            });

            // 3. Initialize SortableJS
            if (typeof Sortable !== 'undefined') {
                const sortable = new Sortable(grid, {
                    handle: '.drag-handle', // drag handle selector
                    animation: 250,
                    ghostClass: 'sortable-ghost',
                    onEnd: function (evt) {
                        // Extract new order IDs
                        const newOrder = [];
                        const cards = grid.querySelectorAll(".bookmark-card");
                        cards.forEach(card => {
                            const id = card.getAttribute("data-id");
                            if (id) newOrder.push(id);
                        });
                        sendMessageToStreamlitClient("streamlit:setComponentValue", {
                            value: { action: "reorder", order: newOrder }
                        });
                    }
                });
            }

            // Adjust frame height automatically
            setTimeout(sendHeight, 50);
        }

        // 4. Connect and listen to Streamlit parent rendering events
        window.addEventListener("message", function(event) {
            if (event.data.type === "streamlit:render") {
                const args = event.data.args;
                const bookmarks = args.bookmarks;
                const deleteId = args.delete_id;
                renderGrid(bookmarks, deleteId);
            }
        });

        // 5. Send ready signal to Streamlit parent (Start Handshake)
        sendMessageToStreamlitClient("streamlit:componentReady", { apiVersion: 1 });
    </script>
</body>
</html>
