name: Wake Up Streamlit (Playwright)

on:
  schedule:
    # 12시간마다 실행 (UTC 00:00, 12:00 -> 한국 시간 기준 오전 9시, 오후 9시)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Actions 탭에서 수동 실행 지원

jobs:
  wake-up:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Playwright 및 Chromium 브라우저 설치
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: 앱 접속 및 깨우기 스크립트 실행
        run: |
          python scripts/wake_up.py
